<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- CSS -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #4f73ff, #6a00ff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            padding: 30px;
            width: 100%;
            max-width: 350px;
            border-radius: 12px;
            box-shadow: 0px 10px 40px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            font-size: 14px;
            color: #444;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #6a00ff;
            box-shadow: 0 0 5px rgba(106, 0, 255, 0.3);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #6a00ff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #4f00cc;
        }

        .signup-text {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .signup-text a {
            color: #6a00ff;
            text-decoration: none;
        }

        /* Mobile Responsive */
        @media (max-width: 400px) {
            .login-container {
                padding: 20px;
            }
        }

        /* Error Message */
        .error {
            color: red;
            margin-bottom: 10px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h2>Welcome Back</h2>

        <div id="errorMessage" class="error"></div>

        <form id="loginForm">
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn">Login</button>

            <p class="signup-text">
                Don't have an account? <a href="#">Sign up</a>
            </p>
        </form>
    </div>


    <!-- JavaScript Validation + Fake Backend -->
    <script>
        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const errorBox = document.getElementById("errorMessage");

            // Basic validation
            if (email === "" || password === "") {
                errorBox.textContent = "Please fill in all fields.";
                return;
            }

            if (!email.includes("@") || !email.includes(".")) {
                errorBox.textContent = "Enter a valid email address.";
                return;
            }

            if (password.length < 6) {
                errorBox.textContent = "Password must be at least 6 characters.";
                return;
            }

            errorBox.textContent = "";

            /*
                🔥 Fake backend logic:
                You can replace this with:
                fetch("yourbackend.com/api/login", { method: "POST", ... })
            */

            const fakeUser = {
                email: "test@gmail.com",
                password: "123456"
            };

            if (email === fakeUser.email && password === fakeUser.password) {
                alert("Login successful!");
                window.location.href = "dashboard.html"; // redirect page
            } else {
                errorBox.textContent = "Incorrect email or password.";
            }
        });
    </script>

</body>
</html>
